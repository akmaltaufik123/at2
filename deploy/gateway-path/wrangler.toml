# Prepared only — NOT deployed. See README.md for manual deploy steps.
name = "ate-gateway-path"
main = "cloudflare-worker.js"
compatibility_date = "2026-09-01"

# Intercepts ONLY /gateway*; every other path keeps serving GitHub Pages.
# zone_name resolves without needing a numeric zone ID.
routes = [
  { pattern = "akmaltaufikenterprise.my/gateway*", zone_name = "akmaltaufikenterprise.my" }
]

[vars]
# Set at deploy time and never committed with a real value:
#   wrangler deploy --var GATEWAY_ORIGIN=https://ate-gateway-production.up.railway.app
# An empty value fails closed (generic 502). The Worker also accepts an
# override from the Cloudflare dashboard instead of this file.
GATEWAY_ORIGIN = ""
