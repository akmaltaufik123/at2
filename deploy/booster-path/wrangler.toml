# ATEBooster Cloudflare Worker
# Proxies optional supplier APIs behind a single ATEBooster interface
name = "ate-booster-path"
main = "cloudflare-worker.js"
compatibility_date = "2026-09-01"

# Intercepts ONLY /booster/api* paths for API proxying
# Static files (HTML/CSS/JS) are served from GitHub Pages directly
routes = [
  { pattern = "akmaltaufikenterprise.my/booster/api*", zone_name = "akmaltaufikenterprise.my" }
]

# Cloudflare secrets. Never store API keys in this file or frontend:
#   wrangler secret put PADOONSTA_API_KEY     # existing supplier
#   wrangler secret put EZKIFY_API_KEY        # Ezkify supplier (optional)
#   wrangler secret put ATEBOOSTER_ADMIN_TOKEN  # admin-only upstream actions
# Deploy the Worker after configuring secrets:
#   wrangler deploy
