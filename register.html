<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0 'sha256-TqbFubH4U0RdsrKL6q9Q8LHihYU+LZtyw7s4OffJPlU=' 'sha256-8DB95xg2ZAKXlNrJ/xffkCnpPIquiFtSsODJhU1JlX8=' 'sha256-z4YNqQjztfMAgOKZ7xMVNk7COfkAZHmUb4fD+dmkGbo='; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">

  <title>Register — Customer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="radial-bg">
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text" data-i18n="loading-text">Sila tunggu...</div>
    </div>
  </div>

  

  <main class="auth-body">
    <div class="lang-switch login-lang">
      <button class="lang-btn" data-lang="my">MY</button>
      <button class="lang-btn" data-lang="en">ENG</button>
    </div>
    <div class="auth-card">
      <a href="index.html" class="brand auth-brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
      <h1 data-i18n="rg-title">Register Account</h1>
      <p class="muted" data-i18n="rg-sub">Create a free customer portal account.</p>

      <form id="register-form" method="post" novalidate>
        <div class="hp-field" aria-hidden="true"><input type="text" id="rg-hp" tabindex="-1" autocomplete="off"></div>
        <div class="form-group">
          <label for="name" data-i18n="rg-name">Full Name</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email" data-i18n="rg-email">Email</label>
          <input type="email" id="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="rg-pass">Password</label>
          <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="rg-btn">Register</button>
      </form>

      <p class="auth-switch" data-i18n="rg-have">Already have an account? <a href="login.html">Login</a></p>
      <p class="auth-switch"><a href="index.html" data-i18n="lg-back">&larr; Back to homepage</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0" integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/customize.js"></script>
  <script>
    (function () {
      var dict = {
        my: {
          "rg-title": "Daftar Akaun",
          "rg-sub": "Buka akaun portal pelanggan percuma.",
          "rg-name": "Nama Penuh",
          "rg-email": "E-mel",
          "rg-pass": "Kata Laluan",
          "rg-btn": "Daftar",
          "rg-have": "Sudah ada akaun? <a href=\"login.html\">Log Masuk</a>",
          "lg-back": "&larr; Kembali ke laman utama",
          "loading-text": "Sila tunggu...",
          "err-config": "Pendaftaran belum dikonfigurasi. Hubungi pentadbir.",
          "err-name": "Sila masukkan nama penuh yang sah (huruf sahaja).",
          "err-email": "Format e-mel tidak sah.",
          "err-pass": "Kata laluan minimum 6 aksara.",
          "rg-ok": "Pendaftaran berjaya! Sila sahkan e-mel anda sebelum log masuk."
        },
        en: {
          "rg-title": "Register Account",
          "rg-sub": "Create a free customer portal account.",
          "rg-name": "Full Name",
          "rg-email": "Email",
          "rg-pass": "Password",
          "rg-btn": "Register",
          "rg-have": "Already have an account? <a href=\"login.html\">Login</a>",
          "lg-back": "&larr; Back to homepage",
          "loading-text": "Please wait...",
          "err-config": "Registration is not configured. Contact the administrator.",
          "err-name": "Please enter a valid full name (letters only).",
          "err-email": "Invalid email format.",
          "err-pass": "Password must be at least 6 characters.",
          "rg-ok": "Registration successful! Please verify your email before logging in."
        }
      };
      var lang = localStorage.getItem("site_lang") || "en";
      function apply() {
        var t = dict[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (t[k] != null) el.innerHTML = t[k];
        });
        document.querySelectorAll(".lang-btn").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-lang") === lang);
        });
        document.documentElement.lang = lang === "my" ? "ms" : "en";
        window.__rg = t;
      }
      document.querySelectorAll(".lang-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          lang = b.getAttribute("data-lang");
          localStorage.setItem("site_lang", lang);
          apply();
        });
      });
      apply();
    })();
  </script>
  <script>
    (function () {
      var errorBox = document.getElementById("form-error");
      var form = document.getElementById("register-form");
      var T = function (k) { return (window.__rg && window.__rg[k]) || ""; };
      
      // Rate limiting for registration attempts
      var REGISTRATION_COOLDOWN = 60000; // 60 seconds between attempts
      var lastAttempt = 0;
      var attemptCount = 0;
      var MAX_ATTEMPTS = 3;
      var LOCKOUT_DURATION = 300000; // 5 minutes lockout
      var lockoutUntil = 0;
      
      if (!window.portal.supabase) {
        errorBox.textContent = T("err-config");
        errorBox.hidden = false;
      }
      
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        
        // Check lockout
        var now = Date.now();
        if (now < lockoutUntil) {
          var remaining = Math.ceil((lockoutUntil - now) / 1000);
          errorBox.textContent = document.documentElement.lang === "en" 
            ? "Too many attempts. Please wait " + remaining + " seconds." 
            : "Terlalu banyak percubaan. Sila tunggu " + remaining + " saat.";
          errorBox.hidden = false;
          return;
        }
        
        // Check rate limit
        if (now - lastAttempt < REGISTRATION_COOLDOWN) {
          errorBox.textContent = document.documentElement.lang === "en"
            ? "Please wait before trying again."
            : "Sila tunggu sebelum mencuba lagi.";
          errorBox.hidden = false;
          return;
        }
        
        // Track attempts
        attemptCount++;
        lastAttempt = now;
        if (attemptCount >= MAX_ATTEMPTS) {
          lockoutUntil = now + LOCKOUT_DURATION;
          attemptCount = 0;
        }
        
        if (document.getElementById("rg-hp").value) return;
        var p = window.portal;
        var name = p.sanitize(document.getElementById("name").value, 60);
        var email = document.getElementById("email").value.trim().toLowerCase();
        var password = document.getElementById("password").value;
        
        // Enhanced password validation
        if (password.length < 8) {
          errorBox.textContent = document.documentElement.lang === "en"
            ? "Password must be at least 8 characters."
            : "Kata laluan mestilah sekurang-kurangnya 8 aksara.";
          errorBox.hidden = false;
          return;
        }
        
        if (name.length < 2 || !/^[A-Za-z\u00C0-\u024F' .-]+$/.test(name)) {
          errorBox.textContent = T("err-name");
          errorBox.hidden = false;
          return;
        }
        if (!p.isValidEmail(email)) {
          errorBox.textContent = T("err-email");
          errorBox.hidden = false;
          return;
        }
        if (password.length < 6 || password.length > 72) {
          errorBox.textContent = T("err-pass");
          errorBox.hidden = false;
          return;
        }
        
        // Disable submit button during request
        var submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = document.documentElement.lang === "en" ? "Registering..." : "Mendaftar...";
        
        try {
          var res = await window.portal.supabase.auth.signUp({
            email: email,
            password: password,
            options: { data: { full_name: name } }
          });
          
          if (res.error) {
            errorBox.textContent = document.documentElement.lang === "en" ? "Registration was unsuccessful. Check your details and try again." : "Pendaftaran tidak berjaya. Semak butiran anda dan cuba lagi.";
            errorBox.hidden = false;
            return;
          }
          
          // Reset attempt counter on success
          attemptCount = 0;
          
          if (res.data.session) {
            window.location.href = "dashboard.html";
          } else {
            errorBox.className = "alert ok";
            errorBox.textContent = T("rg-ok");
            errorBox.hidden = false;
          }
        } catch (err) {
          errorBox.textContent = document.documentElement.lang === "en" 
            ? "An error occurred. Please try again." 
            : "Ralat berlaku. Sila cuba lagi.";
          errorBox.hidden = false;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = T("rg-btn");
        }
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
